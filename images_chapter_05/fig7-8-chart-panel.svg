<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: Microsoft YaHei, SimHei, Arial, sans-serif; fill: #111111; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #555555; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 16px; fill: #555555; }
    .tiny { font-size: 14px; fill: #666666; }
    .card { fill: #ffffff; stroke: #c8c8c8; stroke-width: 2; rx: 22; }
  </style><rect x="80" y="160" width="230" height="150" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><text x="195" y="218" text-anchor="middle" class="label">比较组间差异</text><text x="195" y="262" text-anchor="middle" class="small">条形图 / 箱线图</text><rect x="355" y="160" width="230" height="150" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><text x="470" y="218" text-anchor="middle" class="label">观察时间变化</text><text x="470" y="262" text-anchor="middle" class="small">折线图</text><rect x="630" y="160" width="230" height="150" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><text x="745" y="218" text-anchor="middle" class="label">展示空间分布</text><text x="745" y="262" text-anchor="middle" class="small">地图 / 热力图</text><rect x="905" y="160" width="230" height="150" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><text x="1020" y="218" text-anchor="middle" class="label">揭示变量关系</text><text x="1020" y="262" text-anchor="middle" class="small">散点图 + 拟合线</text><rect x="80" y="370" width="230" height="150" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><text x="195" y="428" text-anchor="middle" class="label">呈现构成比例</text><text x="195" y="472" text-anchor="middle" class="small">堆叠条形图</text><rect x="355" y="370" width="230" height="150" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><text x="470" y="428" text-anchor="middle" class="label">解释理论关系</text><text x="470" y="472" text-anchor="middle" class="small">概念图</text><rect x="630" y="370" width="230" height="150" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><text x="745" y="428" text-anchor="middle" class="label">展示交互效应</text><text x="745" y="472" text-anchor="middle" class="small">交互效应图</text><rect x="905" y="370" width="230" height="150" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><text x="1020" y="428" text-anchor="middle" class="label">呈现文献格局</text><text x="1020" y="472" text-anchor="middle" class="small">矩阵表</text><text x="600" y="640" text-anchor="middle" class="small">生成图表代码后，研究者必须核对每一个数据点、单位、图注与统计标记</text>
</svg>