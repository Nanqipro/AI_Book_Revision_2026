<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">本书学习路径</title>
  <desc id="desc">从认识人工智能到理解模型、驾驭对话、构建智能体并进入真实应用场景</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c76ff"/>
      <stop offset="1" stop-color="#09a985"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebfbf7"/>
      <stop offset="1" stop-color="#f8fffd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0c3567" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1440" height="480" rx="26" fill="#f5f8fc"/>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="720" y="62" text-anchor="middle" fill="#102a43" font-size="32" font-weight="700">一条从“看懂”到“会用”的学习路径</text>
    <text x="720" y="94" text-anchor="middle" fill="#6b7f96" font-size="17">不要求编程背景，从认知与原理出发，逐步抵达可执行的 AI Agent</text>
    <rect x="122" y="164" width="1196" height="7" rx="3.5" fill="url(#line)" opacity=".28"/>
    <rect x="158" y="157" width="1124" height="21" rx="10.5" fill="url(#line)" opacity=".08"/>

    <g filter="url(#shadow)">
      <g transform="translate(62 125)">
        <rect width="252" height="280" rx="20" fill="url(#card1)" stroke="#c8dcff"/>
        <circle cx="126" cy="42" r="32" fill="#246bdb"/>
        <text x="126" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">01</text>
        <text x="126" y="110" text-anchor="middle" fill="#153e75" font-size="25" font-weight="700">认识 AI</text>
        <text x="126" y="150" text-anchor="middle" fill="#526d88" font-size="17">认知实验 · 发展史</text>
        <text x="126" y="180" text-anchor="middle" fill="#526d88" font-size="17">能力边界 · 时代影响</text>
        <rect x="53" y="222" width="146" height="35" rx="17.5" fill="#dceaff"/>
        <text x="126" y="245" text-anchor="middle" fill="#246bdb" font-size="15">建立正确心智模型</text>
      </g>
      <g transform="translate(328 125)">
        <rect width="252" height="280" rx="20" fill="url(#card1)" stroke="#c8dcff"/>
        <circle cx="126" cy="42" r="32" fill="#2c76ff"/>
        <text x="126" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">02</text>
        <text x="126" y="110" text-anchor="middle" fill="#153e75" font-size="25" font-weight="700">理解模型</text>
        <text x="126" y="150" text-anchor="middle" fill="#526d88" font-size="17">机器学习 · 深度学习</text>
        <text x="126" y="180" text-anchor="middle" fill="#526d88" font-size="17">注意力 · 多模态</text>
        <rect x="53" y="222" width="146" height="35" rx="17.5" fill="#dceaff"/>
        <text x="126" y="245" text-anchor="middle" fill="#246bdb" font-size="15">看懂能力从何而来</text>
      </g>
      <g transform="translate(594 125)">
        <rect width="252" height="280" rx="20" fill="#f1f8ff" stroke="#aeddf2"/>
        <circle cx="126" cy="42" r="32" fill="#168ec4"/>
        <text x="126" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">03</text>
        <text x="126" y="110" text-anchor="middle" fill="#0e597c" font-size="25" font-weight="700">驾驭对话</text>
        <text x="126" y="150" text-anchor="middle" fill="#526d88" font-size="17">Prompt · Context</text>
        <text x="126" y="180" text-anchor="middle" fill="#526d88" font-size="17">结构化输出 · Skills</text>
        <rect x="53" y="222" width="146" height="35" rx="17.5" fill="#d8f1fb"/>
        <text x="126" y="245" text-anchor="middle" fill="#1680ad" font-size="15">从提问升级为设计</text>
      </g>
      <g transform="translate(860 125)">
        <rect width="252" height="280" rx="20" fill="url(#card2)" stroke="#bdeadd"/>
        <circle cx="126" cy="42" r="32" fill="#0a9c78"/>
        <text x="126" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">04</text>
        <text x="126" y="110" text-anchor="middle" fill="#08674f" font-size="25" font-weight="700">构建 Agent</text>
        <text x="126" y="150" text-anchor="middle" fill="#526d88" font-size="17">感知 · 规划 · 工具</text>
        <text x="126" y="180" text-anchor="middle" fill="#526d88" font-size="17">反馈 · 多智能体协作</text>
        <rect x="53" y="222" width="146" height="35" rx="17.5" fill="#d9f5ec"/>
        <text x="126" y="245" text-anchor="middle" fill="#0a8c6d" font-size="15">让 AI 真正完成任务</text>
      </g>
      <g transform="translate(1126 125)">
        <rect width="252" height="280" rx="20" fill="url(#card2)" stroke="#bdeadd"/>
        <circle cx="126" cy="42" r="32" fill="#087c68"/>
        <text x="126" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">05</text>
        <text x="126" y="110" text-anchor="middle" fill="#075d50" font-size="25" font-weight="700">进入场景</text>
        <text x="126" y="150" text-anchor="middle" fill="#526d88" font-size="17">办公 · 科研 · 医学</text>
        <text x="126" y="180" text-anchor="middle" fill="#526d88" font-size="17">材料 · 内容创作</text>
        <rect x="53" y="222" width="146" height="35" rx="17.5" fill="#d9f5ec"/>
        <text x="126" y="245" text-anchor="middle" fill="#087c68" font-size="15">把能力迁移到现实</text>
      </g>
    </g>
  </g>
</svg>
