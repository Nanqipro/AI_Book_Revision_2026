<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: Microsoft YaHei, SimHei, Arial, sans-serif; fill: #111111; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #555555; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 16px; fill: #555555; }
    .tiny { font-size: 14px; fill: #666666; }
    .card { fill: #ffffff; stroke: #c8c8c8; stroke-width: 2; rx: 22; }
  </style><rect x="90" y="160" width="230" height="300" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><circle cx="205" cy="230" r="42" fill="#444444"/><text x="205" y="242" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">1</text><text x="205" y="310" text-anchor="middle" class="label">1 明确终点</text><foreignObject x="118" y="345" width="174" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Microsoft YaHei, SimHei, Arial, sans-serif;font-size:16px;color:#555555;text-align:center;line-height:1.55">用一句话写清核心研究问题</div></foreignObject><path d="M328 310 C345 310,345 310,358 310" stroke="#666666" stroke-width="4" fill="none"/><polygon points="358,310 342,300 342,320" fill="#666666"/><rect x="360" y="160" width="230" height="300" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><circle cx="475" cy="230" r="42" fill="#444444"/><text x="475" y="242" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">2</text><text x="475" y="310" text-anchor="middle" class="label">2 倒推子问题</text><foreignObject x="388" y="345" width="174" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Microsoft YaHei, SimHei, Arial, sans-serif;font-size:16px;color:#555555;text-align:center;line-height:1.55">事实、机制、方法与证据分别需要回答什么</div></foreignObject><path d="M598 310 C615 310,615 310,628 310" stroke="#666666" stroke-width="4" fill="none"/><polygon points="628,310 612,300 612,320" fill="#666666"/><rect x="630" y="160" width="230" height="300" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><circle cx="745" cy="230" r="42" fill="#444444"/><text x="745" y="242" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">3</text><text x="745" y="310" text-anchor="middle" class="label">3 转成AI任务</text><foreignObject x="658" y="345" width="174" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Microsoft YaHei, SimHei, Arial, sans-serif;font-size:16px;color:#555555;text-align:center;line-height:1.55">说明输入、动作与输出格式</div></foreignObject><path d="M868 310 C885 310,885 310,898 310" stroke="#666666" stroke-width="4" fill="none"/><polygon points="898,310 882,300 882,320" fill="#666666"/><rect x="900" y="160" width="230" height="300" rx="24" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/><circle cx="1015" cy="230" r="42" fill="#444444"/><text x="1015" y="242" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">4</text><text x="1015" y="310" text-anchor="middle" class="label">4 记录与迭代</text><foreignObject x="928" y="345" width="174" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Microsoft YaHei, SimHei, Arial, sans-serif;font-size:16px;color:#555555;text-align:center;line-height:1.55">保留已确认、已排除与下一步</div></foreignObject><rect x="180" y="525" width="840" height="78" rx="22" fill="#f4f4f4" stroke="#aaaaaa"/><text x="600" y="558" text-anchor="middle" class="label">任务链的核心不是“把问题问漂亮”，而是让每一步都能被核验、接续和修正</text><text x="600" y="588" text-anchor="middle" class="small">上一任务的输出，应该成为下一任务的输入</text>
</svg>